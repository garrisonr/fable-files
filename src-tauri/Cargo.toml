[package]
name = "fable-files"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fable_files_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", ] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
ufm-core.workspace = true
ufm-vfs = { path = "../crates/ufm-vfs" }
ufm-jobs = { path = "../crates/ufm-jobs" }
ufm-catalog = { path = "../crates/ufm-catalog" }
ufm-search = { path = "../crates/ufm-search" }
ufm-sync = { path = "../crates/ufm-sync" }
ufm-preview = { path = "../crates/ufm-preview" }
ufm-themes = { path = "../crates/ufm-themes" }
ufm-plugins = { path = "../crates/ufm-plugins" }
ufm-mcp = { path = "../crates/ufm-mcp" }
ufm-media = { path = "../crates/ufm-media" }
ufm-emu = { path = "../crates/ufm-emu" }
ufm-torrent = { path = "../crates/ufm-torrent" }
# Ebook P3: the narration seam (segmenter, voices, model pins,
# helper-process client). LIB ONLY in the app — the sherpa-linked
# helper binary lives behind the crate's `engine` feature and
# ships as a bundled resource, so the app binary never links the
# TTS runtime and a missing runtime degrades to a plain sentence.
ufm-tts = { path = "../crates/ufm-tts" }
# Ebook P3: narration playback (the queue IS the playback clock).
rodio = "0.21"
# Ebook P3: the narrator model archive (download, hash-verify,
# unpack) — versions already in the workspace lock via zip tooling.
tar = "0.4"
bzip2 = "0.4"
tracing.workspace = true
base64 = "0.22"
ureq = "2"
# The features ARE the store: with none, the keyring crate silently
# falls back to its in-memory mock, which "provides no persistence" —
# every credential Fable ever "saved" evaporated (2026-10-15 TMDB
# incident; see docs + FINDINGS). sync-secret-service = the real
# GNOME/KDE Secret Service over D-Bus for our sync call sites;
# crypto-rust = pure-Rust session crypto (no system OpenSSL dep).
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
sha1 = "0.10"
crc32fast = "1"
filetime = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
md5 = "0.7"
open = "5"
# Music Completion: audio tag read/write (mp3/flac/ogg/m4a — titles,
# artists, lyrics, embedded pictures) for the enrichment pipeline.
lofty = "0.22"
# Network Locations: in-process GIO mounts (GVfs). 0.18.4 is already
# in Cargo.lock via the Tauri GTK stack — this changes no versions.
gio = "0.18"
portable-pty = "0.8"
sha2 = "0.10"
# File Auditor: decompresses the bundled SCOWL word list
# (assets/words-en.txt.gz) at runtime. Already in the lockfile via
# zip tooling — declaring it directly changes no versions.
flate2 = "1"
libc = "0.2"
tracing-subscriber.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
