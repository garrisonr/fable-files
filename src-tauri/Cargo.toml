[package]
name = "fable-files"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fable_files_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
ufm-core.workspace = true
ufm-vfs = { path = "../crates/ufm-vfs" }
ufm-jobs = { path = "../crates/ufm-jobs" }
ufm-catalog = { path = "../crates/ufm-catalog" }
ufm-search = { path = "../crates/ufm-search" }
ufm-preview = { path = "../crates/ufm-preview" }
ufm-themes = { path = "../crates/ufm-themes" }
ufm-plugins = { path = "../crates/ufm-plugins" }
ufm-mcp = { path = "../crates/ufm-mcp" }
ufm-media = { path = "../crates/ufm-media" }
ufm-emu = { path = "../crates/ufm-emu" }
tracing.workspace = true
base64 = "0.22"
open = "5"
tracing-subscriber.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
