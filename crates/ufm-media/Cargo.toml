[package]
name = "ufm-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ufm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
# ROM identification (romdat): streaming CRC32 + MD5 + SHA1.
crc32fast = "1"
md5 = "0.7"
sha1 = "0.10"
# CHD reader (chd): deflate + raw LZMA1 + FLAC, all pure Rust.
flate2 = "1"
lzma-rust = "0.1"
claxon = "0.4"
